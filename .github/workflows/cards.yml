name: Update README cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# If you push again while a run is going, the old run is cancelled and a fresh one starts
concurrency:
  group: readme-cards
  cancel-in-progress: true

# GRS_TOKEN is a personal access token saved under Settings -> Secrets and variables -> Actions.
# The built-in GITHUB_TOKEN cannot read your contribution history, which made every stat show 0.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&show=contributions,all_time_contribs&contribs_include_own_repos=true&hide=stars,prs,issues,contribs&hide_rank=true&number_format=long&hide_border=true&bg_color=060818&title_color=1ADB9E&icon_color=9B59F5&text_color=E8EDF5&ring_color=1ADB9E&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      # valgfag is excluded because the full WordPress core in it would swamp the language stats
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&exclude_repo=valgfag&hide=hack&hide_border=true&bg_color=060818&title_color=1ADB9E&text_color=E8EDF5
          path: profile/top-langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          # Get any commits you pushed while this was running, then push on top of them
          git pull --rebase origin main
          git push
