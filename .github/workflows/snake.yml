name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The built-in token can't read your contribution calendar, so the grid came out empty
          github_token: ${{ secrets.GRS_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#1ADB9E&color_dots=#0F1228,#0E5A47,#12A57A,#1ADB9E,#7DFFD3
            dist/snake-light.svg?color_snake=#1ADB9E&color_dots=#EBEDF0,#B8F2DF,#5FE6B9,#1ADB9E,#0F1228

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
