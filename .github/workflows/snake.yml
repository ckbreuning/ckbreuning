# Save as .github/workflows/snake.yml in your ckbreuning/ckbreuning repo.
# Generates the contribution snake in your portfolio colours every night.
name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2D9CDB&color_dots=#0B1220,#12345A,#1D6FA5,#2D9CDB,#5DCAA5
            dist/snake-light.svg?color_snake=#2D9CDB&color_dots=#EBEDF0,#BFE3F5,#7CC3EA,#2D9CDB,#12345A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
